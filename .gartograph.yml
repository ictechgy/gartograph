# gartograph의 자기 아키텍처 규칙.
# 계층은 한 방향이다: cmd → cli → {analysis, source, config, export} → graph.
# graph는 아무것도 의존하지 않는 순수 도메인이다.
components:
  main: ["cmd/**"]
  cli: ["cli"]
  analysis: ["analysis"]
  harvest: ["source"]
  config: ["config"]
  export: ["export"]
  core: ["graph"]
  testutil: ["internal/**"]
deps:
  main: ["cli"]
  cli: ["analysis", "harvest", "config", "export", "core"]
  analysis: ["core", "config"]
  harvest: ["core"]
  config: ["core"]
  export: ["core"]
  core: []
  testutil: []
# testutil은 테스트 전용이다 — 프로덕션 파일의 import는 위반.
# (fileRules의 자기 검증이기도 하다)
fileRules:
  - name: testutil-only-in-tests
    from: "!*_test.go"
    to: testutil
    reason: "testutil provides test fixtures; production code must not import it"
