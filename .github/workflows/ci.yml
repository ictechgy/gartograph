name: ci

on:
  push:
    branches: [main]
  pull_request:

# 두 잡 모두 저장소를 읽기만 한다. 저장소 기본 토큰 설정과 무관하게
# PR 코드(go test·go run)가 쓰기 권한 토큰을 받지 않게 한다.
permissions:
  contents: read

jobs:
  release-assets:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 뒤 단계는 원격 git 인증을 쓰지 않으므로 checkout 토큰을 .git 설정에 남기지 않는다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: /bin/bash Scripts/test-publish-release-assets.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: Scripts/coverage.sh

      # 도그푸딩 — 이 도구로 이 저장소를 분석한다
      - run: go run ./cmd/gartograph rules --strict
      - run: go run ./cmd/gartograph cycles --level type --strict
      - run: go run ./cmd/gartograph cycles --level symbol --strict
